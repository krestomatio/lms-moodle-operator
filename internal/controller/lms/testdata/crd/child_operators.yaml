# Minimal stand-ins for the child operator CRDs that LMSMoodle creates.
# The child operators own the real CRDs, which also preserve unknown spec and
# status fields.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: moodles.m4e.krestomat.io
spec:
  group: m4e.krestomat.io
  names:
    kind: Moodle
    listKind: MoodleList
    plural: moodles
    singular: moodle
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
    subresources:
      status: {}
---
